services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ferrofast_pg
    environment:
      POSTGRES_USER: ferrofast
      POSTGRES_PASSWORD: ferrofast
      POSTGRES_DB: ferrofast
    ports:
      - "5432:5432"
    volumes:
      - ferrofast_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrofast -d ferrofast"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ferrofast_pgdata:
